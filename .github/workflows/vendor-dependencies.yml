name: Vendor browser dependencies
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/vendor-dependencies.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pinned browser libraries
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund \
            pdfjs-dist@2.16.105 pdf-lib@1.17.1 jspdf@4.2.1 jszip@3.10.1 \
            file-saver@2.0.5 cropperjs@1.5.13 sortablejs@1.15.0 \
            tesseract.js@5.1.1 tesseract.js-core@5.1.1
      - name: Copy browser assets and OCR data
        run: |
          set -euo pipefail
          mkdir -p vendor/pdfjs vendor/pdf-lib vendor/jspdf vendor/jszip vendor/file-saver
          mkdir -p vendor/cropperjs vendor/sortablejs vendor/tesseract vendor/tesseract-core vendor/tesseract/lang-data
          cp node_modules/pdfjs-dist/build/pdf.min.js vendor/pdfjs/
          cp node_modules/pdfjs-dist/build/pdf.worker.min.js vendor/pdfjs/
          cp node_modules/pdf-lib/dist/pdf-lib.min.js vendor/pdf-lib/
          cp node_modules/jspdf/dist/jspdf.umd.min.js vendor/jspdf/
          cp node_modules/jszip/dist/jszip.min.js vendor/jszip/
          cp node_modules/file-saver/dist/FileSaver.min.js vendor/file-saver/
          cp node_modules/cropperjs/dist/cropper.min.css vendor/cropperjs/
          cp node_modules/cropperjs/dist/cropper.min.js vendor/cropperjs/
          cp node_modules/sortablejs/Sortable.min.js vendor/sortablejs/
          cp node_modules/tesseract.js/dist/tesseract.min.js vendor/tesseract/
          cp node_modules/tesseract.js/dist/worker.min.js vendor/tesseract/
          cp node_modules/tesseract.js-core/* vendor/tesseract-core/
          curl --fail --location --retry 3 https://tessdata.projectnaptha.com/4.0.0/tha.traineddata.gz -o vendor/tesseract/lang-data/tha.traineddata.gz
          curl --fail --location --retry 3 https://tessdata.projectnaptha.com/4.0.0/eng.traineddata.gz -o vendor/tesseract/lang-data/eng.traineddata.gz
          test -s vendor/tesseract-core/tesseract-core-simd-lstm.wasm.js
          test -s vendor/tesseract-core/tesseract-core-simd-lstm.wasm
      - name: Copy upstream license texts
        run: |
          set -euo pipefail
          mkdir -p THIRD_PARTY_LICENSES
          for pkg in pdfjs-dist pdf-lib jspdf jszip file-saver cropperjs sortablejs tesseract.js tesseract.js-core; do
            mkdir -p "THIRD_PARTY_LICENSES/$pkg"
            cp "node_modules/$pkg/LICENSE" "THIRD_PARTY_LICENSES/$pkg/LICENSE" 2>/dev/null || true
            cp "node_modules/$pkg/NOTICE" "THIRD_PARTY_LICENSES/$pkg/NOTICE" 2>/dev/null || true
          done
      - name: Commit vendored assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor THIRD_PARTY_LICENSES
          if ! git diff --cached --quiet; then
            git commit -m "Vendor browser libraries and OCR data for offline asset loading"
            git push
          fi
